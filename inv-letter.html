<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roland & Rochelle • Invitation Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold:       #b8962e;
  --gold-light: #d4af5a;
  --gold-pale:  #f0d890;
  --cream:      #fdfaf4;
  --ivory:      #faf7ef;
  --text:       #3a3020;
  --muted:      #8a7a5a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Poppins',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;}

/* Petals / Stars canvas */
#petals-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

/* ═══════════════════════════
   SLIDESHOW
═══════════════════════════ */
.slideshow-section{position:relative;z-index:1;background:transparent;padding:7rem 0 4rem;}

/* Back button */
.back-btn{
  position:fixed;top:1.25rem;left:1.25rem;z-index:200;
  display:flex;align-items:center;gap:.5rem;
  padding:.6rem 1.2rem;
  background:rgba(253,250,244,0.88);backdrop-filter:blur(12px);
  border:1px solid rgba(184,150,46,0.25);border-radius:50px;
  font-size:.8rem;font-weight:500;letter-spacing:.06em;
  color:var(--gold);text-decoration:none;
  box-shadow:0 4px 20px rgba(184,150,46,0.12);
  transition:transform .3s,box-shadow .3s;
}
.back-btn:hover{transform:translateX(-4px);box-shadow:0 8px 30px rgba(184,150,46,0.22);}

/* ═══════════════════════════
   SLIDESHOW
═══════════════════════════ */

.section-header{text-align:center;margin-bottom:3rem;padding:0 1.5rem;}
.section-header .pre-title{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem;}
.section-header h2{
  font-family:'Great Vibes',cursive;font-size:clamp(2.5rem,5vw,3.8rem);
  background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold));
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:goldShimmer 4s linear infinite;
}
.section-header .divider{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:.6rem;}
.section-header .divider::before,.section-header .divider::after{
  content:'';width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-light));
}
.section-header .divider::after{background:linear-gradient(90deg,var(--gold-light),transparent);}
.section-header .divider span{color:var(--gold);font-size:.9rem;}

.slideshow-viewer{position:relative;max-width:860px;margin:0 auto 2.5rem;padding:0 1.5rem;}

.slide-hint{
  text-align:center;
  font-size:.72rem;
  letter-spacing:.12em;
  color:var(--gold);
  margin-bottom:.75rem;
  opacity:0.8;
  animation:hintPulse 2.5s ease-in-out infinite;
}

@keyframes hintPulse {
  0%,100%{ opacity:0.5; transform:translateY(0); }
  50%    { opacity:1;   transform:translateY(-3px); }
}

body.dark .slide-hint { color: var(--gold-light); }

.slide-display{
  position:relative;border-radius:28px;overflow:hidden;
  box-shadow:0 30px 80px rgba(184,150,46,0.15);
  background:var(--cream);cursor:zoom-in;height:520px;
  border:1px solid rgba(184,150,46,0.12);
}
.slide-display::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;z-index:5;
  background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));
  background-size:200% 100%;animation:goldShimmer 3s linear infinite;
}
.slide-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;opacity:0;transition:opacity .6s ease;pointer-events:none;
}
.slide-img.active{opacity:1;pointer-events:auto;}

.slide-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;
  width:48px;height:48px;border-radius:50%;
  border:1px solid rgba(184,150,46,0.35);
  background:rgba(253,250,244,0.85);backdrop-filter:blur(8px);
  color:var(--gold);font-size:1.1rem;cursor:pointer;display:grid;place-items:center;
  transition:background .25s,transform .25s,box-shadow .25s;
}
.slide-arrow:hover{background:var(--gold);color:#fff;border-color:var(--gold);transform:translateY(-50%) scale(1.1);box-shadow:0 6px 20px rgba(184,150,46,0.3);}
.slide-arrow.prev{left:-64px;} .slide-arrow.next{right:-64px;}

.slide-counter{
  position:absolute;bottom:1rem;right:1rem;z-index:10;
  font-size:.72rem;letter-spacing:.1em;color:var(--muted);
  background:rgba(253,250,244,0.88);backdrop-filter:blur(6px);
  padding:.3rem .75rem;border-radius:20px;border:1px solid rgba(184,150,46,0.18);
}

.thumbnails{
  display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;
  padding:0 1.5rem;max-width:860px;margin:0 auto;
}
.thumb{
  width:80px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;cursor:pointer;
  border:2px solid transparent;box-shadow:0 4px 14px rgba(184,150,46,0.08);
  transition:transform .25s,border-color .25s,box-shadow .25s;flex-shrink:0;
  background:var(--ivory);
}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .35s;}
.thumb:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 10px 28px rgba(184,150,46,0.2);}
.thumb.active{border-color:var(--gold);box-shadow:0 6px 24px rgba(184,150,46,0.28);}

.autoplay-row{display:flex;justify-content:center;margin-top:2rem;}
.autoplay-btn{
  padding:.55rem 1.4rem;border-radius:50px;
  border:1px solid rgba(184,150,46,0.3);background:rgba(255,253,245,0.9);
  color:var(--gold);font-size:.8rem;font-family:'Poppins',sans-serif;
  letter-spacing:.08em;cursor:pointer;
  transition:background .25s,box-shadow .25s,transform .2s;
}
.autoplay-btn:hover,.autoplay-btn.playing{
  background:var(--gold);color:#fff;
  box-shadow:0 8px 24px rgba(184,150,46,0.28);transform:translateY(-2px);
}

.progress-bar-wrap{max-width:860px;margin:1.25rem auto 0;padding:0 1.5rem;display:none;}
.progress-bar-wrap.visible{display:block;}
.progress-bar{height:2px;background:rgba(184,150,46,0.12);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:2px;}

/* ═══════════════════════════
   LIGHTBOX
═══════════════════════════ */
.lightbox{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(20,15,5,0.93);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;cursor:zoom-out;
}
.lightbox.open{display:flex;}
.lightbox-img-wrap{
  position:relative;max-width:92vw;max-height:90vh;
  animation:lightboxIn .35s cubic-bezier(0.34,1.56,0.64,1);
}
.lightbox-img-wrap::before{
  content:'';position:absolute;inset:-6px;
  border:1px solid rgba(212,175,90,0.3);border-radius:18px;pointer-events:none;
}
.lightbox img{
  max-width:92vw;max-height:86vh;border-radius:12px;display:block;
  box-shadow:0 40px 120px rgba(0,0,0,0.6);cursor:default;
}
.lightbox-close{
  position:absolute;top:1.25rem;right:1.25rem;
  width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.08);
  color:#fff;font-size:1.25rem;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .2s;z-index:10;
}
.lightbox-close:hover{background:rgba(255,255,255,0.22);transform:rotate(90deg);}
.lightbox-nav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:10;
  width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(212,175,90,0.3);background:rgba(20,15,5,0.55);
  color:var(--gold-light);font-size:1.2rem;cursor:pointer;display:grid;place-items:center;
  transition:background .25s,transform .25s;
}
.lightbox-nav:hover{background:rgba(184,150,46,0.5);transform:translateY(-50%) scale(1.05);}
.lightbox-nav.lb-prev{left:1rem;} .lightbox-nav.lb-next{right:1rem;}
.lightbox-caption{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  font-family:'Cormorant Garamond',serif;font-size:.95rem;
  color:rgba(255,248,225,0.65);letter-spacing:.06em;white-space:nowrap;
}

/* ═══════════════════════════
   FOOTER
═══════════════════════════ */
.letter-footer{
  position:relative;z-index:1;
  background:linear-gradient(135deg,#2a2410,#3a3218);
  text-align:center;padding:3rem 1rem;
}
.letter-footer .footer-names{
  font-family:'Great Vibes',cursive;font-size:2.2rem;
  background:linear-gradient(135deg,var(--gold-light),#f0d890);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  display:block;margin-bottom:.4rem;animation:float 4s ease-in-out infinite;
}
.letter-footer .footer-sub{font-size:.75rem;letter-spacing:.18em;color:rgba(255,255,255,0.35);text-transform:uppercase;}

/* ═══════════════════════════
   KEYFRAMES
═══════════════════════════ */
@keyframes goldShimmer  { to{background-position:200% center;} }
@keyframes fadeIn       { from{opacity:0} to{opacity:1} }
@keyframes fadeInUp     { from{opacity:0;transform:translateY(28px)} to{opacity:1;transform:translateY(0)} }
@keyframes float        { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
@keyframes lightboxIn   { from{opacity:0;transform:scale(0.88)} to{opacity:1;transform:scale(1)} }

/* responsive */
@media(max-width:860px){.slide-arrow.prev{left:.5rem;} .slide-arrow.next{right:.5rem;} .slide-display{height:380px;}}
@media(max-width:600px){.thumb{width:60px;} .slide-display{height:260px;}}

/* ═══════════════════════════
   SKELETON LOADER
═══════════════════════════ */
#skeleton-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  padding: 2rem;
  transition: opacity 0.5s ease;
}
body.dark #skeleton-loader { background: #000; }

#skeleton-loader.fade-out {
  opacity: 0;
  pointer-events: none;
}

.sk-logo {
  font-family: 'Great Vibes', cursive;
  font-size: 2.8rem;
  background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: goldShimmer 2s linear infinite;
}

.sk-block {
  border-radius: 12px;
  background: linear-gradient(90deg,
    rgba(184,150,46,0.08) 0%,
    rgba(184,150,46,0.18) 40%,
    rgba(184,150,46,0.08) 100%);
  background-size: 200% 100%;
  animation: skShimmer 1.4s ease-in-out infinite;
}
body.dark .sk-block {
  background: linear-gradient(90deg,
    rgba(255,255,255,0.04) 0%,
    rgba(184,150,46,0.12) 40%,
    rgba(255,255,255,0.04) 100%);
  background-size: 200% 100%;
}

@keyframes skShimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* skeleton size classes used in HTML */
.sk-main   { width: min(700px, 90vw); height: 460px; border-radius: 24px; }
.sk-thumbs { display: flex; gap: .75rem; justify-content: center; }
.sk-thumb  { width: 80px; height: 60px; border-radius: 10px; }
.sk-bar    { width: min(700px, 90vw); height: 2px; border-radius: 2px; }
.sk-btn    { width: 130px; height: 38px; border-radius: 50px; }

/* ── Dark Mode ── */
body.dark {
  background: #000000 !important;
  --cream: #000000;
  --ivory: #000000;
  --text:  #f0e8d0;
  --muted: #b0a080;
}

body.dark .slideshow-section {
  background: transparent !important;
}

body.dark .slide-display {
  background: #050400;
  border-color: rgba(184,150,46,0.22);
}

body.dark .thumb { background: #050400; border-color: transparent; }
body.dark .thumb.active { border-color: var(--gold); }

body.dark .slide-counter {
  background: rgba(0,0,0,0.7);
  color: rgba(255,248,225,0.7);
}

body.dark .autoplay-btn {
  background: rgba(5,4,0,0.9);
  border-color: rgba(184,150,46,0.35);
  color: var(--gold-light);
}

body.dark .section-header .pre-title { color: var(--gold-light); }
body.dark .letter-footer { background: linear-gradient(135deg,#000,#050400) !important; }

body.dark .back-btn {
  background: rgba(0,0,0,0.9);
  border-color: rgba(184,150,46,0.3);
}

/* Dark toggle switch */
.dark-toggle-wrap {
  position: fixed;
  top: 1.25rem;
  right: 1.25rem;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(253,250,244,0.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(184,150,46,0.28);
  border-radius: 50px;
  padding: 0.4rem 0.75rem;
  box-shadow: 0 4px 18px rgba(184,150,46,0.15);
  cursor: pointer;
  user-select: none;
  transition: background 0.3s, border-color 0.3s;
}
.dark-toggle-wrap:hover { border-color: rgba(184,150,46,0.55); }
body.dark .dark-toggle-wrap { background: rgba(0,0,0,0.88); border-color: rgba(184,150,46,0.4); }

.dark-toggle-icon { font-size: 0.85rem; line-height: 1; transition: transform 0.4s ease; }
.dark-toggle-wrap:hover .dark-toggle-icon { transform: rotate(20deg); }

.toggle-track {
  position: relative; width: 40px; height: 22px;
  border-radius: 11px;
  background: rgba(184,150,46,0.2);
  border: 1px solid rgba(184,150,46,0.3);
  transition: background 0.35s, border-color 0.35s;
  flex-shrink: 0;
}
body.dark .toggle-track {
  background: linear-gradient(135deg, var(--gold), #9a7820);
  border-color: var(--gold-light);
}

.toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
body.dark .toggle-thumb { transform: translateX(18px); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<!-- Apply dark mode immediately to prevent flash and ensure canvas boots correctly -->

  if (localStorage.getItem('darkMode') === 'true') {

  }

<!-- ═══ SLIDESHOW ═══ -->
<section class="slideshow-section">
  <div class="section-header">

    <h2>Our Letter to You</h2>
    <div class="divider"><span>✦</span></div>

</section>

<!-- ═══ FOOTER ═══ -->
<footer class="letter-footer">
  <span class="footer-names">Roland &amp; Rochelle</span>

</footer>

  <div style="position:fixed;bottom:0.6rem;left:0.8rem;z-index:9000;font-size:0.55rem;letter-spacing:0.35em;color:rgba(184,150,46,0.35);pointer-events:none;user-select:none;font-family:monospace;">RENZ</div>

<!-- ═══ LIGHTBOX ═══ -->

  <button class="lightbox-close" id="lbClose">✕</button>

<script>
/* ── Petals / Stars / Shooting Stars ── */
(function(){
  const c=document.getElementById('petals-canvas'),ctx=c.getContext('2d');
  const COLS=['rgba(212,175,90,0.45)','rgba(232,210,140,0.4)','rgba(245,237,216,0.6)','rgba(255,248,225,0.55)','rgba(200,169,110,0.35)','rgba(240,230,190,0.5)'];
  let petals=[],stars=[],shooters=[],animId=null;
  let mode=document.body.classList.contains('dark')?'dark':'light';

  function rsz(){c.width=innerWidth;c.height=innerHeight;if(mode==='dark')buildStars();}
  rsz();addEventListener('resize',rsz);

  function rp(ft){return{x:Math.random()*c.width,y:ft?-20:Math.random()*c.height,w:2+Math.random()*4,h:1.5+Math.random()*3,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.04,sx:(Math.random()-.5)*.6,sy:.5+Math.random()*1.1,op:.3+Math.random()*.6,col:COLS[Math.floor(Math.random()*COLS.length)],sw:Math.random()*Math.PI*2,ss:.01+Math.random()*.02};}
  function buildPetals(){petals=Array.from({length:35},()=>rp(false));}
  function animPetals(){
    ctx.clearRect(0,0,c.width,c.height);
    petals.forEach(p=>{p.sw+=p.ss;p.x+=p.sx+Math.sin(p.sw)*.5;p.y+=p.sy;p.rot+=p.rs;if(p.y>c.height+30)Object.assign(p,rp(true));ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.op;ctx.beginPath();ctx.ellipse(0,0,p.w,p.h,0,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();ctx.restore();});
    if(mode==='light')animId=requestAnimationFrame(animPetals);
  }

  function buildStars(){const n=Math.floor(c.width*c.height/4000);stars=Array.from({length:n},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:.4+Math.random()*1.6,op:.2+Math.random()*.8,tw:Math.random()*Math.PI*2,ts:.008+Math.random()*.025,col:Math.random()>.85?'rgba(255,248,200,1)':'rgba(255,255,255,1)'}));}

  function newShooter(){const sx=Math.random()*c.width*.8,sy=Math.random()*c.height*.4,a=Math.PI/6+Math.random()*(Math.PI/8),sp=10+Math.random()*16,len=80+Math.random()*180;return{x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,len,op:0,phase:'fadein',trail:[],maxTrail:Math.floor(len/sp)+2,col:Math.random()>.5?'rgba(255,248,200,':'rgba(180,220,255,'};}

  function animDark(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{s.tw+=s.ts;const a=s.op*(.5+.5*Math.sin(s.tw));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=s.col.replace('1)',a+')');ctx.fill();});
    if(shooters.length<3&&Math.random()<.018)shooters.push(newShooter());
    shooters=shooters.filter(s=>{
      s.trail.push({x:s.x,y:s.y});if(s.trail.length>s.maxTrail)s.trail.shift();
      s.x+=s.vx;s.y+=s.vy;
      if(s.phase==='fadein'){s.op+=.08;if(s.op>=1){s.op=1;s.phase='travel';}}
      else if(s.phase==='travel'){s.td=(s.td||0)+Math.hypot(s.vx,s.vy);if(s.td>s.len*1.8)s.phase='fadeout';}
      else{s.op-=.05;if(s.op<=0)return false;}
      if(s.x>c.width+100||s.y>c.height+100)return false;
      if(s.trail.length>1){const g=ctx.createLinearGradient(s.trail[0].x,s.trail[0].y,s.x,s.y);g.addColorStop(0,s.col+'0)');g.addColorStop(.6,s.col+(s.op*.4)+')');g.addColorStop(1,s.col+s.op+')');ctx.beginPath();ctx.moveTo(s.trail[0].x,s.trail[0].y);s.trail.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.lineTo(s.x,s.y);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.stroke();}
      const gw=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,4);gw.addColorStop(0,s.col+s.op+')');gw.addColorStop(.4,s.col+(s.op*.6)+')');gw.addColorStop(1,s.col+'0)');ctx.beginPath();ctx.arc(s.x,s.y,4,0,Math.PI*2);ctx.fillStyle=gw;ctx.fill();
      return true;
    });
    if(mode==='dark')animId=requestAnimationFrame(animDark);
  }

  function startLight(){mode='light';if(animId)cancelAnimationFrame(animId);shooters=[];stars=[];buildPetals();animPetals();}
  function startDark(){mode='dark';if(animId)cancelAnimationFrame(animId);petals=[];buildStars();animDark();}

  if(mode==='dark')startDark();else startLight();
  document.addEventListener('darkModeChanged',e=>{if(e.detail.dark)startDark();else startLight();});
})();

/* ── Slideshow ── */
const slides=document.querySelectorAll('.slide-img'),thumbs=document.querySelectorAll('.thumb');
const counter=document.getElementById('slideCounter'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
const autoplayBtn=document.getElementById('autoplayBtn'),progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill'),slideDisplay=document.getElementById('slideDisplay');
const TOTAL=slides.length,MS=3500;let cur=0,intv=null;

function goTo(i){
  slides[cur].classList.remove('active');thumbs[cur].classList.remove('active');
  cur=(i+TOTAL)%TOTAL;
  slides[cur].classList.add('active');thumbs[cur].classList.add('active');
  counter.textContent=`${cur+1} / ${TOTAL}`;
  if(intv)resetProg();
}
function resetProg(){progressFill.style.transition='none';progressFill.style.width='0%';void progressFill.offsetWidth;progressFill.style.transition=`width ${MS}ms linear`;progressFill.style.width='100%';}
function startAuto(){clearInterval(intv);intv=setInterval(()=>goTo(cur+1),MS);resetProg();progressWrap.classList.add('visible');autoplayBtn.textContent='⏸ Pause';autoplayBtn.classList.add('playing');}
function stopAuto(){clearInterval(intv);intv=null;progressFill.style.transition='none';progressFill.style.width='0%';progressWrap.classList.remove('visible');autoplayBtn.textContent='▶ Auto Play';autoplayBtn.classList.remove('playing');}

prevBtn.addEventListener('click',()=>goTo(cur-1));
nextBtn.addEventListener('click',()=>goTo(cur+1));
thumbs.forEach(t=>t.addEventListener('click',()=>goTo(parseInt(t.dataset.index))));
autoplayBtn.addEventListener('click',()=>intv?stopAuto():startAuto());

// Auto-start on load
startAuto();
document.addEventListener('keydown',e=>{if(lb.classList.contains('open'))return;if(e.key==='ArrowLeft')goTo(cur-1);if(e.key==='ArrowRight')goTo(cur+1);});

/* ── Lightbox ── */
const lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCaption');
const lbClose=document.getElementById('lbClose'),lbPrev=document.getElementById('lbPrev'),lbNext=document.getElementById('lbNext');
const srcs=Array.from(slides).map(s=>({src:s.src,alt:s.alt}));let lbc=0;
lbImg.style.transition='opacity .2s ease';
function openLb(i){lbc=i;lbImg.src=srcs[i].src;lbCap.textContent=srcs[i].alt;lb.classList.add('open');}
function closeLb(){lb.classList.remove('open');lbImg.src='';}
function lbGo(i){lbc=(i+srcs.length)%srcs.length;lbImg.style.opacity='0';setTimeout(()=>{lbImg.src=srcs[lbc].src;lbCap.textContent=srcs[lbc].alt;lbImg.style.opacity='1';},200);}
slideDisplay.addEventListener('click',e=>{if(e.target.classList.contains('slide-img')&&e.target.classList.contains('active'))openLb(cur);});
lbClose.addEventListener('click',closeLb);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb();});
lbPrev.addEventListener('click',e=>{e.stopPropagation();lbGo(lbc-1);});
lbNext.addEventListener('click',e=>{e.stopPropagation();lbGo(lbc+1);});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')lbGo(lbc-1);if(e.key==='ArrowRight')lbGo(lbc+1);});

/* ── Dark Mode ── */
const darkToggle = document.getElementById('darkToggle');
const darkIcon   = document.getElementById('darkIcon');
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  darkIcon.textContent = '☀️';
}
darkToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  darkIcon.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('darkMode', isDark);
  document.dispatchEvent(new CustomEvent('darkModeChanged', { detail: { dark: isDark } }));
});

/* ── Skeleton dismiss ── */
window.addEventListener('load', () => {
  const sk = document.getElementById('skeleton-loader');
  if (!sk) return;
  sk.classList.add('fade-out');
  sk.addEventListener('transitionend', () => sk.remove(), { once: true });
});
</script>
